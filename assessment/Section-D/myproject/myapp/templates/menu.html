<!DOCTYPE html>
<html>
<head>
    <title>Menu</title>
</head>
<body>

    <h1>Restaurant Menu</h1>

    {% for item in menu_items %}
        <h3>{{ item.name }}</h3>
        <p>Price: ₹{{ item.price }}</p>
        <p>Category: {{ item.category }}</p>
    {% empty %}
        <p>No menu items available.</p>
    {% endfor %}

</body>
</html>
