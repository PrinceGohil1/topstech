<!DOCTYPE html>
<html>
<head>
    <title>Orders</title>
</head>
<body>

<h1>Orders</h1>

{% for order in orders %}

    <h3>Order {{ order.id }}</h3>

    {% for item in order.orderitem_set.all %}
        <p>
            {{ item.menu_item.name }}
            - Quantity: {{ item.quantity }}
            - Price: Rs. {{ item.menu_item.price }}
        </p>
    {% endfor %}

{% endfor %}

</body>
</html>
