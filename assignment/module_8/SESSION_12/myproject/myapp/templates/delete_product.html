<!DOCTYPE html>
<html>
<head>
    <title>Delete Product</title>
</head>
<body>

<h1>Delete Product</h1>

<p>
    Are you sure you want to delete
    <strong>{{ product.name }}</strong>?
</p>

<form method="POST">
    {% csrf_token %}

    <button type="submit">
        Yes, delete
    </button>

    <a href="{% url 'product_list' %}">
        <button type="button">Cancel</button>
    </a>
</form>

</body>
</html>
