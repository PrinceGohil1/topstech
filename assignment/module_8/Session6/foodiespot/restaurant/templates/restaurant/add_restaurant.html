<!DOCTYPE html>
<html>
<head>
    <title>Add Restaurant</title>
</head>

<body>

    <h1>Add Restaurant</h1>

    {% if form.errors %}
        <div>
            <h3>Please correct the following errors:</h3>

            {{ form.errors }}
        </div>
    {% endif %}


    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Add Restaurant
        </button>

    </form>

</body>
</html>
