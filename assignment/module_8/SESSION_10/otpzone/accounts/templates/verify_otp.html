<!DOCTYPE html>
<html>

<head>
    <title>Verify OTP</title>
</head>

<body>

    <h1>Verify OTP</h1>

    {% if message %}
        <p>{{ message }}</p>
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        {{ form.non_field_errors }}

        <div>
            {{ form.otp.label_tag }}
            {{ form.otp }}

            {{ form.otp.errors }}
        </div>

        <br>

        <button type="submit">
            Verify OTP
        </button>

    </form>

</body>

</html>
