<!DOCTYPE html>
<html>
<head>
    <title>MusicZone</title>
</head>

<body>

    <nav>

        <a href="{% url 'home' %}">
            MusicZone
        </a>

        &nbsp;&nbsp;

        {% if user.is_authenticated %}

            <span>
                Welcome, {{ user.username }}
            </span>

            &nbsp;&nbsp;

            <form
                method="POST"
                action="{% url 'logout' %}"
                style="display:inline;"
            >

                {% csrf_token %}

                <button type="submit">
                    Logout
                </button>

            </form>

        {% else %}

            <a href="{% url 'login' %}">
                Login
            </a>

            &nbsp;&nbsp;

            <a href="{% url 'signup' %}">
                Signup
            </a>

        {% endif %}

    </nav>

    <hr>

    <h1>Welcome to MusicZone</h1>

    <p>
        MusicZone Homepage
    </p>

</body>
</html>
