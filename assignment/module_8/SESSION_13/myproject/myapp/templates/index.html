<!DOCTYPE html>
<html>
<head>
    <title>Spotify Playlist</title>
</head>
<body>

<h2>🎵 My Spotify Playlist</h2>

<div id="playlist">

    <div id="song-1">
        <span>Shape of You - Ed Sheeran</span>
        <button onclick="deleteSong(1)">Delete</button>
    </div>

    <br>

    <div id="song-2">
        <span>Believer - Imagine Dragons</span>
        <button onclick="deleteSong(2)">Delete</button>
    </div>

    <br>

    <div id="song-3">
        <span>Perfect - Ed Sheeran</span>
        <button onclick="deleteSong(3)">Delete</button>
    </div>

</div>


<script>

function deleteSong(id) {

    fetch(`https://jsonplaceholder.typicode.com/posts/${id}`, {
        method: "DELETE"
    })

    .then(response => {

        if (response.ok) {

            document.getElementById(`song-${id}`).remove();

            alert("Song deleted successfully!");

        }

    })

    .catch(error => {

        console.log(error);

    });

}

</script>

</body>
</html>
